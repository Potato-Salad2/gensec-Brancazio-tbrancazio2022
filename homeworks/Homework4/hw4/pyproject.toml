[project]
name = "hw4"
version = "0.1.0"
description = "Cybersecurity investigation agent using MCP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.9.0",
    "langchain-google-genai>=2.1.0",
    "langchain-mcp-adapters>=0.1.0",
    "langgraph>=0.4.0",
    "python-dotenv>=1.1.0",
    "langchain>=1.4.7",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
